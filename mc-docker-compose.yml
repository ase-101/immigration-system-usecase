services:
  database:
    image: 'postgres:bookworm'
    ports:
      - 5455:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis-server:
    image: redis:6.0
    ports:
      - "6379:6379"
    restart: always

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  local-platform-service:
    image: 'mosipint/mock-platform:ES-2797'
    user: root
    ports: 
      - 8080:8080

  immigration-system:
    image: 'mosipdev/mock-identity-system:develop'
    user: root
    ports:
      - 8082:8082
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MOSIP_MOCK_IDA_KYC_TRANSACTION_TIMEOUT_SECS=900
      - MOSIP_ESIGNET_HOST=localhost:8088
      - MOSIP_MOCK_IDA_KYC_PSUT_FIELD=email
      - MOSIP_MOCK_IDA_IDENTITY_SCHEMA_URL=http://local-platform-service:8080/masterdata/identity-schema
      - MOSIP_MOCK_IDA_IDENTITY_OPENID_CLAIMS_MAPPING={"fullName":"name","email":"email","encodedPhoto":"picture","homeCountry":"address.country"}
    depends_on:
      - database

  esignet:
    image: 'mosipid/esignet-with-plugins:1.7.1'
    user: root
    ports: 
      - 8088:8088
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - plugin_name_env=esignet-mock-plugin.jar
      - MOSIP_ESIGNET_DATABASE_URL=jdbc:postgresql://database:5432/mosip_esignet?currentSchema=esignet
      - MOSIP_ESIGNET_DATABASE_USERNAME=postgres
      - MOSIP_ESIGNET_DATABASE_PASSWORD=postgres
      - MOSIP_ESIGNET_MOCK_DOMAIN_URL=http://immigration-system:8082
      - MOSIP_ESIGNET_INTEGRATION_KEY_BINDER=MockKeyBindingWrapperService
      - SPRING_REDIS_HOST=redis-server
      - KAFKA_ENABLED=false
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - MOSIP_SIGNUP_DOMAIN_URL=http://localhost:4000
      - MOSIP_ESIGNET_DOMAIN_URL=http://esignet:8088
      - MOSIP_ESIGNET_UI_CONFIG_LOGIN_ID_OPTIONS={{'id':'email','svg':'email_icon','prefixes':'','postfix':'','maxLength':'','regex':''}}
    depends_on:
      - database
      - redis-server

  esignet-ui:
    image: 'mosipid/oidc-ui:1.7.1'
    user: root
    ports:
      - 3000:3000
    environment:
      - container_user=mosip
      - DEFAULT_WELLKNOWN=%5B%7B%22name%22%3A%22OpenID%20Configuration%22%2C%22value%22%3A%22%2F.well-known%2Fopenid-configuration%22%7D%2C%7B%22name%22%3A%22Jwks%20Json%22%2C%22value%22%3A%22%2F.well-known%2Fjwks.json%22%7D%2C%7B%22name%22%3A%22Authorization%20Server%22%2C%22value%22%3A%22%2F.well-known%2Foauth-authorization-server%22%7D%5D
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - esignet

  signup:
    image: 'mosipdev/signup-with-plugins:ES-2797'
    user: root
    ports:
      - 8089:8089
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - plugin_name_env=esignet-mock-plugin.jar
      - MOSIP_SIGNUP_DOMAIN_URL=http://localhost:4000
      - MOSIP_ESIGNET_DOMAIN_URL=http://esignet:8088
      - MOSIP_ESIGNET_MOCK_DOMAIN_URL=http://immigration-system:8082
      - KEYCLOAK_EXTERNAL_URL=http://local-platform-service:8080
      - SPRING_CACHE_TYPE=redis
      - SPRING_DATA_REDIS_HOST=redis-server
      - SPRING_DATA_REDIS_PASSWORD=
      - MOSIP_INTERNAL_DOMAIN_URL=http://local-platform-service:8080
      - MOSIP_SIGNUP_CLIENT_SECRET=test
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - MOSIP_SIGNUP_MOCK_GET_SCHEMA_ENDPOINT=http://local-platform-service:8080/masterdata/ui-spec
      - MOSIP_SIGNUP_IDENTIFIER_REGEX=^[a-zA-Z_@\\.]+
      - MOSIP_SIGNUP_IDENTIFIER_PREFIX=
      - MANAGEMENT_TRACING_ENABLED=false
      - MOSIP_SIGNUP_IDENTIFIER_ALLOWED_CHARACTERS=^[a-zA-Z_@\\.]+
      - MOSIP_SIGNUP_IDENTIFIER_MIN_LENGTH=8
      - MOSIP_SIGNUP_IDENTIFIER_MAX_LENGTH=20
      - MOSIP_SIGNUP_IDENTIFIER_NAME=email
      - MOSIP_SIGNUP_MOCK_MANDATORY_ATTRIBUTES_CREATE=email,passportId,fullName,consent
      - MOSIP_SIGNUP_MOCK_MANDATORY_ATTRIBUTES_UPDATE=
      - MOSIP_SIGNUP_MOCK_USERNAME_FIELD=email
      - MOSIP_SIGNUP_RP_ACR_VALUES=mosip:idp:acr:generated-code
      - MOSIP_SIGNUP_CONFIG_SERVER_URL=http://local-platform-service:8080/
      - MOSIP_SIGNUP_MOCK_CONFIG_SERVER_URL=http://local-platform-service:8080/
      - MOSIP_SIGNUP_MOCK_IDENTITY_VERIFICATION_STORY_NAME=identity_verifier_story.json
      - MOSIP_SIGNUP_TEST_IDENTITY_VERIFICATION_STORY_NAME=test_verifier_story.json
      - MOSIP_SIGNUP_RP_UI_CONFIG={'client_id':'$${mosip.signup.oauth.client-id}','redirect_uri_verification':'http://localhost:4000/identity-verification','redirect_uri_signin':'http://localhost:3000/login','redirect_uri_consent':'http://localhost:3000/consent','authorization_endpoint':'http://localhost:3000/authorize','response_type':'code','scope':'openid','claims':'','acr_values':'$${mosip.signup.rp.acr_values}','expiry_time':$${mosip.signup.rp.expiry_time},'redirect_delay':$${mosip.signup.rp.redirect_delay}}
    depends_on:
      - redis-server
    volumes:
      - ./oidckeystore.p12:/home/mosip/oidckeystore.p12

  signup-ui:
    image: 'mosipdev/signup-ui:ES-2797'
    platform: linux/amd64  # Add this line
    user: root
    ports:
      - 4000:3000
    environment:
      - container_user=mosip
      - REACT_APP_API_BASE_URL=http://signup:8089/v1/signup
      - DEFAULT_LANG=en
      - NODE_ENV=development
      - SECURE_WEBSOCKET=false
    volumes:
      - ./signup-nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - signup

  omera-bank-service:
    image: 'mosipdev/mock-relying-party-service:develop'
    user: root
    ports:
      - 8888:8888
    environment:
      - container_user=mosip
      - ESIGNET_SERVICE_URL=http://esignet:8088/v1/esignet
      - ESIGNET_AUD_URL=http://esignet:8088/v1/esignet/oauth/v2/token
      - CLIENT_PRIVATE_
      - JWE_USERINFO_PRIVATE_
      - USERINFO_RESPONSE_TYPE=jwt

  omera-bank-ui:
    image: 'mosipint/mock-relying-party-ui-bank:ES-2797'
    user: root
    ports:
      - 5001:3000
    environment:
      - container_user=mosip
      - MOCK_RELYING_PARTY_SERVER_URL=http://localhost:5001/mock-relying-party-service
      - ESIGNET_UI_BASE_URL=http://localhost:3000
      - REDIRECT_URI=http://localhost:5001/userprofile
      - REDIRECT_URI_REGISTRATION=http://localhost:5001/registration
      - CLIENT_ID=IIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7ADUw
      - ACRS=mosip:idp:acr:generated-code%20mosip:idp:acr:biometrics
      - SIGN_IN_BUTTON_PLUGIN_URL=https://esignet.esdev.mosip.net/plugins/sign-in-button-plugin.js
      - CLAIMS_LOCALES=en
      - DEFAULT_LANG=en
      - SCOPE_USER_PROFILE=openid profile
      - CLAIMS_USER_PROFILE=%7B%0A%20%20%22userinfo%22%3A%20%7B%0A%20%20%20%20%22verified_claims%22%3A%20%7B%0A%20%20%20%20%20%20%22verification%22%3A%20%7B%0A%20%20%20%20%20%20%20%20%22trust_framework%22%3A%20%7B%22value%22%20%3A%20%22eidas%22%7D%0A%20%20%20%20%20%20%7D%2C%0A%20%20%20%20%20%20%22claims%22%3A%20%7B%0A%20%20%20%20%20%20%20%20%22name%22%3A%20%7B%20%22essential%22%20%3A%20true%7D%2C%0A%20%20%20%20%20%20%20%20%22country%22%3A%20%7B%20%22essential%22%20%3A%20true%7D%0A%20%20%20%20%20%20%7D%0A%20%20%20%20%7D%0A%20%20%7D%0A%7D
      - CLAIMS_REGISTRATION=%7B%22userinfo%22%3A%7B%22name%22%3A%7B%22essential%22%3Afalse%7D%2C%22phone_number%22%3A%7B%22essential%22%3Atrue%7D%20%7D%2C%22id_token%22%3A%7B%7D%7D
      - ENABLE_FOREIGNER_SIGNIN=true
      - ESIGNET_UI_BASE_URL_FOREIGNER=http://localhost:3000
      - REDIRECT_URI_FOREIGNER=http://localhost:5001/userprofile
      - REDIRECT_URI_REGISTRATION_FOREIGNER=http://localhost:5001/registration
      - CLIENT_ID_FOREIGNER=IIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7ADUw
      - ACRS_FOREIGNER=mosip:idp:acr:generated-code%20mosip:idp:acr:biometrics
      - CLAIMS_LOCALES_FOREIGNER=en
      - SCOPE_USER_PROFILE_FOREIGNER=openid profile
      - CLAIMS_USER_PROFILE_FOREIGNER=%7B%0A%20%20%22userinfo%22%3A%20%7B%0A%20%20%20%20%22verified_claims%22%3A%20%7B%0A%20%20%20%20%20%20%22verification%22%3A%20%7B%0A%20%20%20%20%20%20%20%20%22trust_framework%22%3A%20%7B%22value%22%20%3A%20%22eidas%22%7D%0A%20%20%20%20%20%20%7D%2C%0A%20%20%20%20%20%20%22claims%22%3A%20%7B%0A%20%20%20%20%20%20%20%20%22name%22%3A%20%7B%20%22essential%22%20%3A%20true%7D%2C%0A%20%20%20%20%20%20%20%20%22country%22%3A%20%7B%20%22essential%22%20%3A%20true%7D%0A%20%20%20%20%20%20%7D%0A%20%20%20%20%7D%0A%20%20%7D%0A%7D
      - CLAIMS_REGISTRATION_FOREIGNER=%7B%22userinfo%22%3A%7B%22name%22%3A%7B%22essential%22%3Afalse%7D%2C%22phone_number%22%3A%7B%22essential%22%3Atrue%7D%20%7D%2C%22id_token%22%3A%7B%7D%7D
    volumes:
      - ./omera-nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - omera-bank-service

  health-portal-service:
    image: 'mosipdev/mock-relying-party-service:develop'
    user: root
    ports:
      - 8889:8888
    environment:
      - container_user=mosip
      - ESIGNET_SERVICE_URL=http://esignet:8088/v1/esignet
      - ESIGNET_AUD_URL=http://esignet:8088/v1/esignet/oauth/v2/token
      - CLIENT_PRIVATE_
      - JWE_USERINFO_PRIVATE_
      - USERINFO_RESPONSE_TYPE=jwt

  health-portal-ui:
    image: 'mosipdev/mock-relying-party-ui:develop'
    user: root
    ports:
      - 5002:3000
    environment:
      - container_user=mosip
      - MOCK_RELYING_PARTY_SERVER_URL=http://localhost:5002/mock-relying-party-service
      - ESIGNET_UI_BASE_URL=http://localhost:3000
      - REDIRECT_URI=http://localhost:5002/userprofile
      - REDIRECT_URI_REGISTRATION=http://localhost:5001/registration
      - CLIENT_ID=IIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKC
      - ACRS=mosip:idp:acr:generated-code
      - SIGN_IN_BUTTON_PLUGIN_URL=https://esignet.esdev.mosip.net/plugins/sign-in-button-plugin.js
      - CLAIMS_LOCALES=en
      - DEFAULT_LANG=en
      - SCOPE_USER_PROFILE=openid email
      - CLAIMS_USER_PROFILE=%7B%0A%20%20%22userinfo%22%3A%20%7B%0A%20%20%20%20%22name%22%3A%20%7B%20%22essential%22%20%3A%20true%7D%2C%0A%20%20%20%20%20%22picture%22%3A%20%7B%20%22essential%22%20%3A%20true%7D%0A%20%20%7D%0A%7D
      - CLAIMS_REGISTRATION=%7B%22userinfo%22%3A%7B%22name%22%3A%7B%22essential%22%3Afalse%7D%2C%22phone_number%22%3A%7B%22essential%22%3Atrue%7D%20%7D%2C%22id_token%22%3A%7B%7D%7D
    volumes:
      - ./healthportal-nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - health-portal-service